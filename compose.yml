services:
  postgres:
    image: postgres:16
    container_name: moviedig-postgres
    environment:
      POSTGRES_USER: moviedig
      POSTGRES_PASSWORD: moviedig_dev
      POSTGRES_DB: moviedig_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviedig"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
